# Base values  
name: appname
replicaCount: 1

image:
  repository: nginx
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL


resources: 
  enabled: false
  requests:
    cpu: "128m"
    memory: 128Mi
  limits:
    cpu: "512m"
    memory: 512Mi

persistence:
  enabled: false

# Networking
ports: 
  - port: 80
    name: http
    protocol: TCP

  
service: 
  - protocol: TCP
    port: 80
    targetPort: 80

# istio virtual service 
istioIngress:
    enabled: true
    gateway: my-gateway
    port: 80
    hostSufix: "example.com"


