suite: service
templates:
  - service.yaml
tests:
  - it: should select pods by app name
    values:
      - ../ci/base.yaml
    asserts:
      - equal:
          path: spec.selector.app
          value: test-app

  - it: should render correct port
    values:
      - ../ci/base.yaml
    asserts:
      - equal:
          path: spec.ports[0].port
          value: 8080

  - it: should name service after app
    values:
      - ../ci/base.yaml
    asserts:
      - equal:
          path: metadata.name
          value: test-app-svc
