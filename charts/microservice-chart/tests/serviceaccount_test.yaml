suite: serviceaccount
templates:
  - serviceaccount.yaml
  - deployment.yaml
tests:
  - it: should not create SA or set name by default
    values:
      - ../ci/base.yaml
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - notExists:
          path: spec.template.spec.serviceAccountName
        template: deployment.yaml

  - it: should create SA named after app
    values:
      - ../ci/with-serviceaccount.yaml
    asserts:
      - isKind:
          of: ServiceAccount
        template: serviceaccount.yaml
      - equal:
          path: metadata.name
          value: test-app
        template: serviceaccount.yaml
      - equal:
          path: automountServiceAccountToken
          value: false
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: test-app
        template: deployment.yaml

  - it: should create SA with custom name
    values:
      - ../ci/with-serviceaccount.yaml
    set:
      serviceAccount.name: custom-sa
    asserts:
      - equal:
          path: metadata.name
          value: custom-sa
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: custom-sa
        template: deployment.yaml

  - it: should use existing SA without creating one
    values:
      - ../ci/base.yaml
    set:
      serviceAccount.name: existing-sa
    asserts:
      - hasDocuments:
          count: 0
        template: serviceaccount.yaml
      - equal:
          path: spec.template.spec.serviceAccountName
          value: existing-sa
        template: deployment.yaml
