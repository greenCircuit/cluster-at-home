suite: configmaps
templates:
  - cm.yaml
tests:
  - it: should not render when configData is empty
    values:
      - ../ci/base.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: should render one ConfigMap per entry
    values:
      - ../ci/with-configmaps.yaml
    asserts:
      - hasDocuments:
          count: 2

  - it: should render map data ConfigMap with correct name
    values:
      - ../ci/with-configmaps.yaml
    documentIndex: 0
    asserts:
      - equal:
          path: metadata.name
          value: app-config
      - exists:
          path: data

  - it: should render string data ConfigMap with correct name
    values:
      - ../ci/with-configmaps.yaml
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: app-config-json
      - exists:
          path: data
