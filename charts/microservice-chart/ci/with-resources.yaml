name: test-app

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP

resources:
  requests:
    cpu: "100m"
    memory: 128Mi
  limits:
    cpu: "500m"
    memory: 512Mi

istioIngress:
  enabled: false

persistence:
  enabled: false
  localStorage:
    volumes: []

configData: []
env: []
secretEnv: []
