name: test-app

image:
  repository: nginx
  tag: latest
  pullPolicy: IfNotPresent

ports:
  - port: 8080
    targetPort: 8080
    name: http
    protocol: TCP

existingVolumes:
  pvcs:
    - name: shared-data
      mountPath: /data
  configMaps:
    - name: shared-config
      mountPath: /etc/config

istioIngress:
  enabled: false

persistence:
  enabled: false
  localStorage:
    volumes: []

configData: []
env: []
secretEnv: []
