{{- if .Values.persistence.enabled }}
{{- range .Values.persistence.localStorage.volumes }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ .name }}-pv
  labels:
    local: {{ .name }}
spec:
  capacity:
    storage: {{ .size }}
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: {{ .hostPath }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: {{ $.Values.persistence.localStorage.nodeKey }}
          operator: In
          values:
          - "true"
{{- end }}
{{- end }}