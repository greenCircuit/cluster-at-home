apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nginx-proxy-config 
data:
  "00-shared.conf": |
    # only send Connection: upgrade when the client asked for it
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
    log_format proxy_json escape=json '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"forwarded_for":"$http_x_forwarded_for",'
      '"user":"$remote_user",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes_sent":$body_bytes_sent,'
      '"request_length":$request_length,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_time":"$upstream_response_time",'
      '"request_id":"$http_x_request_id",'
      '"referrer":"$http_referer",'
      '"user_agent":"$http_user_agent"'
      '}';
{{- range .Values.ports }}
  "{{ .name }}.conf": |
    server {
      listen {{ .port }};
      server_name _;

      access_log /dev/stdout proxy_json;
      error_log /dev/stderr {{ $.Values.proxy.errorLogLevel }};

      client_max_body_size {{ .maxBodySize | default $.Values.proxy.maxBodySize }};
      client_body_timeout {{ $.Values.proxy.bodyTimeout }};

      location / {
          # --- Authentication (Always On) ---
          auth_basic "Restricted Access";
          auth_basic_user_file /auth/.htpasswd;
          proxy_pass http://{{ .target }}:{{ .port }};

          # --- Standard Headers ---
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

          # --- Streaming / long uploads ---
          proxy_request_buffering off;
          proxy_read_timeout {{ .readTimeout | default $.Values.proxy.readTimeout }};
          proxy_send_timeout {{ .sendTimeout | default $.Values.proxy.sendTimeout }};
      }
    }
{{- end }}
