apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-nginx-proxy-config 
data:
  "00-shared.conf": |
    {{- if include "nginx-proxy.cookieGate" . }}
    # cookie gate: 48-char token key overflows default 64 bucket; must precede any map
    map_hash_bucket_size 128;
    {{- end }}
    # only send Connection: upgrade when the client asked for it
    map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
    }
    log_format proxy_json escape=json '{'
      '"time":"$time_iso8601",'
      '"remote_addr":"$remote_addr",'
      '"forwarded_for":"$http_x_forwarded_for",'
      '"user":"$remote_user",'
      '"host":"$host",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"status":$status,'
      '"bytes_sent":$body_bytes_sent,'
      '"request_length":$request_length,'
      '"request_time":$request_time,'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"upstream_time":"$upstream_response_time",'
      '"request_id":"$http_x_request_id",'
      '"referrer":"$http_referer",'
      '"user_agent":"$http_user_agent"'
      '}';
{{- if include "nginx-proxy.cookieGate" . }}
    # generated by init container: $proxy_gate_token, $proxy_gate_auth
    include /auth/gate-map.conf;
    # never leak basic creds upstream, keep app bearer tokens
    map $http_authorization $proxy_upstream_auth {
      "~^Basic " "";
      default    $http_authorization;
    }
{{- end }}
{{- range .Values.ports }}
  "{{ .name }}.conf": |
    server {
      listen {{ .port }};
      server_name _;

      access_log /dev/stdout proxy_json;
      error_log /dev/stderr {{ $.Values.proxy.errorLogLevel }};

      client_max_body_size {{ .maxBodySize | default $.Values.proxy.maxBodySize }};
      client_body_timeout {{ $.Values.proxy.bodyTimeout }};

      location / {
          # --- Authentication (Always On) ---
          {{- if .cookieGate }}
          # basic auth skipped ("off") when valid gate cookie present
          auth_basic $proxy_gate_auth;
          auth_basic_user_file /auth/.htpasswd;
          # only added on 2xx/3xx, never after failed auth
          add_header Set-Cookie "proxy_gate=$proxy_gate_token; Path=/; HttpOnly; Secure; SameSite=Lax; Max-Age={{ $.Values.proxy.cookieGateMaxAge }}";
          proxy_set_header Authorization $proxy_upstream_auth;
          {{- else }}
          auth_basic "Restricted Access";
          auth_basic_user_file /auth/.htpasswd;
          {{- end }}
          proxy_pass http://{{ .target }}:{{ .port }};

          # --- Standard Headers ---
          proxy_http_version 1.1;
          proxy_ssl_server_name on;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

          # --- Streaming / long uploads ---
          proxy_request_buffering off;
          {{- if .streaming }}
          # SSE / streamed responses: flush to client immediately
          proxy_buffering off;
          proxy_cache off;
          {{- end }}
          proxy_read_timeout {{ .readTimeout | default $.Values.proxy.readTimeout }};
          proxy_send_timeout {{ .sendTimeout | default $.Values.proxy.sendTimeout }};
      }
    }
{{- end }}
