# Base values  
name: nginx-auth
replicaCount: 1

# need init image in order to create nginx usename and password
initContainer:
  repository: httpd
  tag: alpine3.23
  pullPolicy: Always

image:
  repository: nginxinc/nginx-unprivileged
  tag: 1.29.3-alpine3.22-otel
  pullPolicy: Always


# set env so can create a secret for nginx login 
secretEnv: {}
  # - name: auth-secret    # name of secret that will be used
  #   values:
  #   - key: "USER_NAME"   # inside secret
  #     value: "AUTH_USER" # inside pod
  #   - key: "USER_PASS"   # inside secret
  #     value: "AUTH_PASS" # inside pod

resources: 
  enabled: true 
  limits:
    cpu: "16m"
    memory: 128Mi

# per-server defaults; each ports entry may override maxBodySize/readTimeout/sendTimeout
proxy:
  maxBodySize: 512m
  bodyTimeout: 300s
  readTimeout: 300s
  sendTimeout: 300s
  errorLogLevel: warn

ports: []
  # - name: grafana
  #   target: http://grafana.monitoring.svc.cluster.local:3000
  #   port: 3000        # pod port spec and svc port spec
  #   protocol: TCP 
     

# create istio virtual service or not
# will use .Values.routes to get all paths
# all routes will use same domain and gateway
istio:
  enabled: true
  gateway: my-gateway
  domain: example.com
