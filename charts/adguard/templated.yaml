# Source: adguard-home/templates/svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: adguard-home
  labels:
    app.kubernetes.io/instance: adguard
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: adguard
---
# Source: adguard-home/templates/deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard 
  labels:
    app.kubernetes.io/name: adguard
    app: adguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
  template:
    metadata:
      labels:
        app: adguard
        app.kubernetes.io/name: adguard
    spec:      
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: copy-configmap
          command: ["sh", "-c"]
          args:
          - |
            if [ -f /opt/adguardhome/conf/AdGuardHome.yaml ]; then
              echo config exists skipping 
            else
              mkdir -p /opt/adguardhome/conf
              cp /tmp/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
            fi 
            
          image: busybox
          imagePullPolicy: Always
          resources: 
            limits:
              memory: "64Mi"
              cpu: "20m"
          securityContext:
              allowPrivilegeEscalation: false
              privileged: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                  - ALL
          volumeMounts:
          # cm mounts config
          - mountPath: /tmp/AdGuardHome.yaml
            name: adguard-home-config
            subPath: AdGuardHome.yaml
          # config that is added to adguard
          - mountPath: /opt/adguardhome/conf
            name: shared-config
      containers:
        - name: adguard-logs-collector
          image: "fluent/fluent-bit:latest"
          imagePullPolicy: Always 
          resources: 
            limits:
              memory: "16Mi"
              cpu: "32m"
          volumeMounts:
            # logs file
            - name: log-share
              mountPath:  /opt/adguardhome/work
            # logs scrape config
            - name: logs-sidecar-config
              mountPath: /fluent-bit/etc

        - name: adguard-home
          image: "adguard/adguardhome:v0.107.65"
          imagePullPolicy: Always 
          resources: 
            limits:
              memory: "812Mi"
              cpu: "36m"
          args:
            - --config
            - /opt/adguardhome/conf/AdGuardHome.yaml
            - --work-dir
            - /opt/adguardhome/work
            - --no-check-update
          env:
            - name: TZ
              value: EST
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE # Allows binding to ports 53
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 0
            failureThreshold: 3
            timeoutSeconds: 1
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 0
            failureThreshold: 30
            timeoutSeconds: 1
            periodSeconds: 5
            
          volumeMounts:
            - name: adguard-home-config
              mountPath: /tmp/AdGuardHome.yaml
              subPath: AdGuardHome.yaml
            - name: shared-config
              mountPath: /opt/adguardhome/conf
            # shared mount between fluentBit and adguard    
            - name: log-share
              mountPath: /opt/adguardhome/work/
      volumes:
      # sharing config between init container and main container
        - name: adguard-home-config
          configMap:
            name: adguard-config
      # ssl certs for https
        - name: ssl
          secret:
            secretName: adguard-ssl
      # store config persistently
        - name: shared
          emptyDir: {}
      # fluentBit config and shared log file    
        - name: log-share
          emptyDir: {}
        - name: logs-sidecar-config
          configMap:
            name: adguard-logs-config
---
# Source: adguard-home/templates/collectorConfig.yaml
# default config will put querylog.json to stdout
---
# Source: adguard-home/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: adguard-certificate
spec:
  secretName: adguard-ssl 
  issuerRef:
    name: self-signed-issuer 
    kind: Issuer
    group: cert-manager.io
