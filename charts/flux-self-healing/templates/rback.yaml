---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flux-healer
  namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-healer-role
rules:
  # Allow checking/creating GitRepositories and Kustomizations
  - apiGroups: ["source.toolkit.fluxcd.io", "kustomize.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "kustomizations"]
    verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-healer-binding
subjects:
  - kind: ServiceAccount
    name: flux-healer
    namespace: flux-system
roleRef:
  kind: ClusterRole
  name: flux-healer-role
  apiGroup: rbac.authorization.k8s.io