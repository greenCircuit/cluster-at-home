---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: flux-system
spec:
  interval: 60m
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: flux-system
spec: 
  targetNamespace: admin-tools
  interval: 10m
  releaseName: headlamp
  chart:
    spec:
      chart: headlamp
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: flux-system
      interval: 10m
  values:
    serviceAccount:
        create: true
    config:
      pluginsDir: /build/plugins
      oidc:
        enabled: false
      authMode: local

    initContainers:
      - name: headlamp-plugins
        image: ghcr.io/headlamp-k8s/headlamp-plugin-flux:latest
        imagePullPolicy: Always
        command:
          - /bin/sh
          - -c
          - mkdir -p /build/plugins && cp -r /plugins/* /build/plugins/ && chown -R 100:101 /build
        securityContext:
          runAsNonRoot: false
          privileged: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: headlamp-plugins
            mountPath: /build/plugins
    volumes:
      - name: headlamp-plugins
        emptyDir: {}

    volumeMounts:
      - name: headlamp-plugins
        mountPath: /build/plugins 