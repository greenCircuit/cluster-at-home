{{- if .Values.runner.enabled }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-runner
  namespace: flux-system
spec:
  targetNamespace: gitlab
  interval: 15m
  chart:
    spec:
      chart: ./k3s/flux-cluster/capability_charts/gitlab-18.3.5/charts/gitlab-runner
      reconcileStrategy: Revision
      interval: 10m
      sourceRef:
        kind: GitRepository
        name: flux-system 
        namespace: flux-system
  valuesFrom:
    # secrets in same ns as flux system
  - kind: Secret
    name: gitlab-runner-token
    valuesKey: token
    targetPath: runnerToken
  values: 
    gitlabUrl: http://gitlab-gitlab-hr-webservice-default:8181/ # name of svc, host where gitlab
    # logLevel: debug
    logLevel: info
    rbac:
      create: true
      # https://docs.gitlab.com/runner/executors/kubernetes/#configure-runner-api-permissions
      rules:
        - resources: ["events"]
          verbs: ["list", "watch"]
        # - resources: ["namespaces"]
        #   verbs: ["create", "delete"]
        - resources: ["pods"]
          verbs: ["create","delete","get"]
        - apiGroups: [""]
          resources: ["pods/attach","pods/exec"]
          verbs: ["get","create","patch","delete"]
        - apiGroups: [""]
          resources: ["pods/log"]
          verbs: ["get","list"]
        - resources: ["secrets"]
          verbs: ["create","delete","get","update"]
        - resources: ["serviceaccounts"]
          verbs: ["get"]
        - resources: ["services"]
          verbs: ["create","get"]

    serviceAccount:
      create: true

    runners:
      config: |
        concurrent = 5
        check_interval = 3
        log_level = "debug"
        log_format = "runner"
        connection_max_age = "15m0s"
        tls_verify = false
        [session_server]
          session_timeout = 1800
        [[runners]]
          url = "http://gitlab-gitlab-hr-webservice-default:8181"
          executor = "kubernetes"
          builds_dir = "/tmp"
          environment = ["HOME=/tmp"]
          shell = "bash"
          request_concurrency = 3
          limit = 5
          [runners.kubernetes]
            helper_image = "gitlab/gitlab-runner-helper:x86_64-v18.4.0"
            host = ""
            bearer_token_overwrite_allowed = false
            image = ""
            namespace = "gitlab"
            namespace_per_job = false
            privileged = true
            node_selector_overwrite_allowed = ".*"
            node_tolerations_overwrite_allowed = ""
            pod_labels_overwrite_allowed = ""
            service_account_overwrite_allowed = ""
            pod_annotations_overwrite_allowed = ""
            [runners.kubernetes.pod_labels]
              app = "gitlab-job"
            [runners.kubernetes.volumes]
              [[runners.kubernetes.volumes.empty_dir]]
                name = "repo"
                mount_path = "/tmp"
            [runners.kubernetes.pod_security_context]
              run_as_non_root = true
              run_as_user = 1000
            [runners.kubernetes.build_container_security_context]
              run_as_user = 1000
{{- end }}