---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-webui
  namespace: flux-system
spec:
  interval: 24h
  url: https://helm.openwebui.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: flux-system 
spec:
  interval: 1h
  targetNamespace: ai-tools 
  chart:
    spec:
      chart: open-webui
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: flux-system
  values:
    extraEnvVars:
      - name: WEBUI_AUTH
        value: "False"
    persistence:
      enabled: true
      storageClass: "local-path"
      size: "2Gi" 
    ollama:
      runtimeClassName: nvidia
      enabled: true
      persistentVolume:
        enabled: true
        storageClass: "local-path"
        size: "15Gi" 
      gpu:
        enabled: true
        type: 'nvidia'
        number: 1
      models:
        pull:
        - qwen3.5:0.8b
        - qwen3.5:2b
      resources:
        limits:
          nvidia.com/gpu: 1
          cpu: "2"
          memory: "10Gi"
